name: Build IMBA VK Proxy

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 15.4
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build wdtt-client (darwin/arm64)
        run: |
          mkdir -p build
          cd android-client
          GOOS=darwin GOARCH=arm64 go build -o ../build/wdtt-client .
          chmod +x ../build/wdtt-client

      - name: Build vkproxy-helper (darwin/arm64, static)
        run: |
          cd helper
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -o ../build/vkproxy-helper .
          chmod +x ../build/vkproxy-helper

      - name: Install WireGuard tools
        run: |
          brew install wireguard-go wireguard-tools
          cp $(which wireguard-go) build/wireguard-go
          cp $(which wg) build/wg
          chmod +x build/wireguard-go build/wg

      - name: Generate app icon (.icns)
        run: |
          SRC="vk-turn-proxy/AppIcon.png"
          ICONSET="build/AppIcon.iconset"
          mkdir -p "$ICONSET"
          sips -z 16   16   "$SRC" --out "$ICONSET/icon_16x16.png"      2>/dev/null
          sips -z 32   32   "$SRC" --out "$ICONSET/icon_16x16@2x.png"   2>/dev/null
          sips -z 32   32   "$SRC" --out "$ICONSET/icon_32x32.png"       2>/dev/null
          sips -z 64   64   "$SRC" --out "$ICONSET/icon_32x32@2x.png"   2>/dev/null
          sips -z 128  128  "$SRC" --out "$ICONSET/icon_128x128.png"     2>/dev/null
          sips -z 256  256  "$SRC" --out "$ICONSET/icon_128x128@2x.png" 2>/dev/null
          sips -z 256  256  "$SRC" --out "$ICONSET/icon_256x256.png"     2>/dev/null
          sips -z 512  512  "$SRC" --out "$ICONSET/icon_256x256@2x.png" 2>/dev/null
          sips -z 512  512  "$SRC" --out "$ICONSET/icon_512x512.png"     2>/dev/null
          sips -z 1024 1024 "$SRC" --out "$ICONSET/icon_512x512@2x.png" 2>/dev/null
          iconutil -c icns "$ICONSET" -o build/AppIcon.icns

      - name: Build SwiftUI app binary
        run: |
          clang -arch arm64 -mmacosx-version-min=14.0 \
            -c vk-turn-proxy/Privileged.c -o build/Privileged.o
          swiftc -parse-as-library \
            -target arm64-apple-macosx14.0 \
            -framework SwiftUI -framework Foundation -framework Security \
            -import-objc-header vk-turn-proxy/Privileged.h \
            vk-turn-proxy/ContentView.swift vk-turn-proxy/vk_turn_proxyApp.swift \
            build/Privileged.o \
            -o build/imba-vk-proxy

      - name: Assemble app bundle
        run: |
          set -e
          APP=build/IMBA\ VK\ Proxy.app
          mkdir -p "$APP/Contents/MacOS"
          mkdir -p "$APP/Contents/Resources"

          cp build/imba-vk-proxy              "$APP/Contents/MacOS/IMBA VK Proxy"
          cp build/AppIcon.icns               "$APP/Contents/Resources/AppIcon.icns"
          cp build/wdtt-client                "$APP/Contents/Resources/wdtt-client"
          cp build/wireguard-go               "$APP/Contents/Resources/wireguard-go"
          cp build/wg                         "$APP/Contents/Resources/wg"
          cp build/vkproxy-helper             "$APP/Contents/Resources/vkproxy-helper"
          cp helper/install.sh                "$APP/Contents/Resources/install.sh"
          cp vk-turn-proxy/imba-logo.svg          "$APP/Contents/Resources/imba-logo.svg"
          cp vk-turn-proxy/whitelist-unblocker.svg "$APP/Contents/Resources/whitelist-unblocker.svg"

          cat > "$APP/Contents/Info.plist" << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key><string>IMBA VK Proxy</string>
              <key>CFBundleIdentifier</key><string>com.imba.vkproxy</string>
              <key>CFBundleName</key><string>IMBA VK Proxy</string>
              <key>CFBundleDisplayName</key><string>IMBA VK Proxy</string>
              <key>CFBundleIconFile</key><string>AppIcon</string>
              <key>CFBundleVersion</key><string>7</string>
              <key>CFBundleShortVersionString</key><string>7.0</string>
              <key>CFBundlePackageType</key><string>APPL</string>
              <key>LSMinimumSystemVersion</key><string>14.0</string>
              <key>NSHighResolutionCapable</key><true/>
              <key>NSPrincipalClass</key><string>NSApplication</string>
              <key>NSAppTransportSecurity</key>
              <dict><key>NSAllowsArbitraryLoads</key><true/></dict>
          </dict>
          </plist>
          EOF

          codesign --force --deep --sign - "$APP"

      - name: Build .pkg installer
        run: |
          set -e
          APP_NAME="IMBA VK Proxy"

          mkdir -p pkg-root/Library/PrivilegedHelperTools
          mkdir -p "pkg-root/Applications"

          cp build/vkproxy-helper                    pkg-root/Library/PrivilegedHelperTools/
          cp -R "build/${APP_NAME}.app"              "pkg-root/Applications/"

          mkdir -p pkg-scripts
          cat > pkg-scripts/postinstall << 'SCRIPT'
          #!/bin/sh
          HELPER=/Library/PrivilegedHelperTools/vkproxy-helper
          /usr/bin/codesign --force --sign - "$HELPER" 2>/dev/null || true
          /usr/bin/xattr -d com.apple.quarantine "$HELPER" 2>/dev/null || true
          chown root:wheel "$HELPER"
          chmod 755 "$HELPER"
          printf "ALL ALL=(root) NOPASSWD: %s\n" "$HELPER" > /etc/sudoers.d/vkproxy
          chown root:wheel /etc/sudoers.d/vkproxy
          chmod 440 /etc/sudoers.d/vkproxy
          /bin/launchctl bootout system /Library/LaunchDaemons/com.vkproxy.helper.plist 2>/dev/null || true
          rm -f /Library/LaunchDaemons/com.vkproxy.helper.plist 2>/dev/null || true
          exit 0
          SCRIPT
          chmod +x pkg-scripts/postinstall

          pkgbuild \
            --root pkg-root \
            --scripts pkg-scripts \
            --identifier com.imba.vkproxy.installer \
            --version 7.0 \
            --install-location / \
            build/imba-vk-proxy-installer.pkg

      - name: Upload app zip
        uses: actions/upload-artifact@v4
        with:
          name: imba-vk-proxy-app
          path: "build/IMBA VK Proxy.app"
          retention-days: 30

      - name: Upload pkg installer
        uses: actions/upload-artifact@v4
        with:
          name: imba-vk-proxy-installer
          path: build/imba-vk-proxy-installer.pkg
          retention-days: 30

  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Node (for Tauri CLI)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@^2

      - name: Build wdtt-client.exe
        shell: bash
        run: |
          mkdir -p build-win/resources
          cd android-client
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o ../build-win/resources/wdtt-client.exe .

      - name: Build wireguard-go.exe
        shell: bash
        run: |
          git clone --depth=1 https://git.zx2c4.com/wireguard-go wg-go-src 2>/dev/null \
            || git clone --depth=1 https://github.com/WireGuard/wireguard-go wg-go-src
          cd wg-go-src
          GOOS=windows GOARCH=amd64 CGO_ENABLED=1 go build -o ../build-win/resources/wireguard-go.exe .

      - name: Download wintun.dll and wg.exe
        shell: powershell
        run: |
          # wintun.dll
          Invoke-WebRequest -Uri "https://www.wintun.net/builds/wintun-0.14.1.zip" -OutFile wintun.zip
          Expand-Archive wintun.zip -DestinationPath wintun-pkg
          Copy-Item "wintun-pkg\wintun\bin\amd64\wintun.dll" "build-win\resources\wintun.dll"

          # wg.exe — from wireguard-windows release
          Invoke-WebRequest -Uri "https://download.wireguard.com/windows-client/wireguard-amd64-0.5.3.msi" -OutFile wireguard.msi
          Start-Process msiexec -ArgumentList "/a wireguard.msi /qn TARGETDIR=$PWD\wg-install" -Wait
          $wg = Get-ChildItem -Recurse "$PWD\wg-install" -Filter "wg.exe" | Select-Object -First 1
          if ($wg) { Copy-Item $wg.FullName "build-win\resources\wg.exe" }
          else { Write-Host "wg.exe not found in MSI, will try choco"; choco install wireguard -y --no-progress; Copy-Item "C:\Program Files\WireGuard\wg.exe" "build-win\resources\wg.exe" }

      - name: Generate Tauri icons
        shell: bash
        run: |
          mkdir -p windows/src-tauri/icons
          cp vk-turn-proxy/AppIcon.png windows/src-tauri/icons/icon-source.png
          npx @tauri-apps/cli@^2 icon windows/src-tauri/icons/icon-source.png \
            --output windows/src-tauri/icons

      - name: Copy resources into Tauri bundle
        shell: bash
        run: |
          mkdir -p windows/src-tauri/resources
          cp build-win/resources/* windows/src-tauri/resources/

      - name: Build Tauri app (NSIS installer)
        working-directory: windows
        run: npx @tauri-apps/cli@^2 build --target x86_64-pc-windows-msvc

      - name: Smoke test
        shell: powershell
        run: |
          $exe = Get-ChildItem -Recurse "windows/src-tauri/target/x86_64-pc-windows-msvc/release" `
            -Filter "imba-vk-proxy.exe" | Select-Object -First 1
          if ($exe) { Write-Host "Binary found: $($exe.FullName)" }
          else { Write-Error "Binary not found!" }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: imba-vk-proxy-windows
          path: windows/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          retention-days: 30
