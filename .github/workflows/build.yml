name: Build macOS App (14+)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 15.4
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Show Swift version
        run: swift --version

      - name: Create Package.swift
        run: |
          cat > Package.swift << 'EOF'
          // swift-tools-version: 5.9
          import PackageDescription
          let package = Package(
              name: "vk-turn-proxy",
              platforms: [.macOS(.v14)],
              targets: [
                  .executableTarget(
                      name: "vk-turn-proxy",
                      path: "vk-turn-proxy",
                      swiftSettings: [
                          .unsafeFlags(["-parse-as-library"])
                      ]
                  )
              ]
          )
          EOF

      - name: Build release binary
        run: swift build -c release --arch arm64

      - name: Assemble app bundle
        run: |
          set -e
          BIN=.build/release/vk-turn-proxy
          APP=vk-turn-proxy.app

          mkdir -p "$APP/Contents/MacOS"
          mkdir -p "$APP/Contents/Resources"

          cp "$BIN" "$APP/Contents/MacOS/vk-turn-proxy"

          cat > "$APP/Contents/Info.plist" << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key><string>vk-turn-proxy</string>
              <key>CFBundleIdentifier</key><string>denny4.vk-turn-proxy</string>
              <key>CFBundleName</key><string>vk-turn-proxy</string>
              <key>CFBundleDisplayName</key><string>VK Turn Proxy</string>
              <key>CFBundleVersion</key><string>1</string>
              <key>CFBundleShortVersionString</key><string>1.0</string>
              <key>CFBundlePackageType</key><string>APPL</string>
              <key>LSMinimumSystemVersion</key><string>14.0</string>
              <key>NSHighResolutionCapable</key><true/>
              <key>NSPrincipalClass</key><string>NSApplication</string>
              <key>NSAppTransportSecurity</key>
              <dict><key>NSAllowsArbitraryLoads</key><true/></dict>
          </dict>
          </plist>
          EOF

          codesign --force --deep --sign - "$APP"

      - name: Zip app bundle
        run: zip -r vk-turn-proxy-macos14.zip vk-turn-proxy.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vk-turn-proxy-macos14
          path: vk-turn-proxy-macos14.zip
          retention-days: 7
