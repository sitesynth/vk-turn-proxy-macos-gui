name: Build macOS App (14+)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 15.4
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build wdtt-client (darwin/arm64)
        run: |
          mkdir -p build
          cd android-client
          GOOS=darwin GOARCH=arm64 go build -o ../build/wdtt-client .
          chmod +x ../build/wdtt-client

      - name: Install WireGuard tools
        run: |
          brew install wireguard-go wireguard-tools
          cp $(which wireguard-go) build/wireguard-go
          cp $(which wg) build/wg
          chmod +x build/wireguard-go build/wg

      - name: Build SwiftUI app binary
        run: |
          swiftc -parse-as-library \
            -target arm64-apple-macosx14.0 \
            -framework SwiftUI -framework Foundation -framework Security \
            vk-turn-proxy/ContentView.swift vk-turn-proxy/vk_turn_proxyApp.swift \
            -o build/vk-turn-proxy

      - name: Assemble app bundle
        run: |
          set -e
          APP=build/vk-turn-proxy.app
          mkdir -p "$APP/Contents/MacOS"
          mkdir -p "$APP/Contents/Resources"

          cp build/vk-turn-proxy    "$APP/Contents/MacOS/vk-turn-proxy"
          cp build/wdtt-client      "$APP/Contents/Resources/wdtt-client"
          cp build/wireguard-go     "$APP/Contents/Resources/wireguard-go"
          cp build/wg               "$APP/Contents/Resources/wg"

          cat > "$APP/Contents/Info.plist" << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key><string>vk-turn-proxy</string>
              <key>CFBundleIdentifier</key><string>com.vkproxy.app</string>
              <key>CFBundleName</key><string>VK Turn Proxy</string>
              <key>CFBundleDisplayName</key><string>VK Turn Proxy</string>
              <key>CFBundleVersion</key><string>3</string>
              <key>CFBundleShortVersionString</key><string>3.0</string>
              <key>CFBundlePackageType</key><string>APPL</string>
              <key>LSMinimumSystemVersion</key><string>14.0</string>
              <key>NSHighResolutionCapable</key><true/>
              <key>NSPrincipalClass</key><string>NSApplication</string>
              <key>NSAppTransportSecurity</key>
              <dict><key>NSAllowsArbitraryLoads</key><true/></dict>
          </dict>
          </plist>
          EOF

          codesign --force --deep --sign - "$APP"

      - name: Zip app bundle
        run: cd build && zip -r vk-turn-proxy-macos14.zip vk-turn-proxy.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vk-turn-proxy-macos14
          path: build/vk-turn-proxy-macos14.zip
          retention-days: 30
